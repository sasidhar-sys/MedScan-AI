<svg viewBox="0 0 860 90" xmlns="http://www.w3.org/2000/svg" width="860" height="90">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="860" height="90" rx="10" fill="#0a0a0f"/>
  <rect width="858" height="88" x="1" y="1" rx="9" fill="none" stroke="url(#glowGrad)" stroke-width="1" stroke-opacity="0.5"/>
  <rect width="860" height="2" fill="url(#glowGrad)" opacity="0.4">
    <animate attributeName="y" from="0" to="90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="3s" repeatCount="indefinite"/>
  </rect>
  <polyline points="10,25 10,10 25,10" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.8"/>
  <polyline points="835,10 850,10 850,25" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.8"/>
  <polyline points="10,65 10,80 25,80" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.8"/>
  <polyline points="835,80 850,80 850,65" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.8"/>
  <rect x="728" y="36" width="10" height="22" rx="1" fill="#00f0ff" filter="url(#textGlow)">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <style>
    .line { font-family: 'Courier New', Courier, monospace; font-size: 19px; font-weight: bold; text-anchor: middle; filter: url(#textGlow); }
    .l1 { fill: #00f0ff; animation: cycle 12s 0s infinite; }
    .l2 { fill: #a78bfa; animation: cycle 12s 4s infinite; opacity: 0; }
    .l3 { fill: #00f0ff; animation: cycle 12s 8s infinite; opacity: 0; }
    @keyframes cycle { 0% { opacity:0; } 5% { opacity:1; } 28% { opacity:1; } 33% { opacity:0; } 100% { opacity:0; } }
    .prefix { fill: #7c3aed; font-size: 16px; font-family: 'Courier New', monospace; }
  </style>
  <text x="48" y="52" class="prefix" text-anchor="start" opacity="0.7">AI://</text>
  <text x="430" y="53" class="line l1">&#x1F52C;  AI-Powered Esophageal Cancer Detection</text>
  <text x="430" y="53" class="line l2">&#x26A1;  Gemini 2.5 Flash  |  EfficientNet-B0  |  FastAPI</text>
  <text x="430" y="53" class="line l3">&#x1F6E1;&#xFE0F;  Real-Time Medical Image Analysis  |  98.7% Accuracy</text>
</svg>
