<svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg" width="100%" preserveAspectRatio="none">
  <defs>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0a0a0f"/>
      <stop offset="35%"  stop-color="#1a0a2e"/>
      <stop offset="65%"  stop-color="#0a1a2e"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="50%"  stop-color="#7c3aed" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#00f0ff" stop-opacity="1"/>
      <stop offset="50%"  stop-color="#7c3aed" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#00f0ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base fill -->
  <rect width="1200" height="120" fill="url(#waveGrad1)"/>

  <!-- Wave layer 1 - back -->
  <path fill="#7c3aed" fill-opacity="0.25">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0,40 C200,80 400,0 600,40 C800,80 1000,10 1200,40 L1200,120 L0,120 Z;
              M0,60 C200,20 400,80 600,50 C800,20 1000,70 1200,30 L1200,120 L0,120 Z;
              M0,40 C200,80 400,0 600,40 C800,80 1000,10 1200,40 L1200,120 L0,120 Z"/>
  </path>

  <!-- Wave layer 2 - mid -->
  <path fill="#00f0ff" fill-opacity="0.15">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="M0,70 C300,20 600,90 900,50 C1050,30 1150,60 1200,70 L1200,120 L0,120 Z;
              M0,50 C300,90 600,30 900,70 C1050,90 1150,40 1200,60 L1200,120 L0,120 Z;
              M0,70 C300,20 600,90 900,50 C1050,30 1150,60 1200,70 L1200,120 L0,120 Z"/>
  </path>

  <!-- Wave layer 3 - front glow -->
  <path fill="url(#waveGrad2)" fill-opacity="0.2">
    <animate attributeName="d" dur="5s" repeatCount="indefinite"
      values="M0,90 C400,50 800,100 1200,80 L1200,120 L0,120 Z;
              M0,80 C400,110 800,60 1200,95 L1200,120 L0,120 Z;
              M0,90 C400,50 800,100 1200,80 L1200,120 L0,120 Z"/>
  </path>

  <!-- Glowing top edge line -->
  <line x1="0" y1="1" x2="1200" y2="1" stroke="url(#glowLine)" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Floating particles -->
  <circle cx="100" cy="60" r="2" fill="#00f0ff" fill-opacity="0.8">
    <animate attributeName="cy" values="60;30;60" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="80" r="1.5" fill="#7c3aed" fill-opacity="0.9">
    <animate attributeName="cy" values="80;45;80" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.9;0.3;0.9" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="50" r="2.5" fill="#00f0ff" fill-opacity="0.7">
    <animate attributeName="cy" values="50;20;50" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.7;0.1;0.7" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="75" r="2" fill="#7c3aed" fill-opacity="0.8">
    <animate attributeName="cy" values="75;40;75" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.8;0.2;0.8" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="65" r="1.5" fill="#00f0ff" fill-opacity="0.9">
    <animate attributeName="cy" values="65;35;65" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.9;0.3;0.9" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
